# Configuracion para desplegar el frontend en Netlify.
# Importar el repositorio y Netlify toma esta configuracion automaticamente.
# La variable VITE_API_URL se define en el panel de Netlify:
#   Site settings -> Environment variables -> VITE_API_URL
#   Ejemplo: https://tu-api.azurewebsites.net/api

[build]
  base = "Frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
